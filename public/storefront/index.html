<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="NOVENDIGIT premium digital products for everyone.">
  <title>NOVEN DIGIT Store</title>
  <link rel="stylesheet" href="/store/styles.css">
</head>
<body>
  <header class="site-header glass">
    <a class="brand" href="#products" aria-label="Noven Digit home"><span class="brand-mark">ND</span><strong>NOVEN DIGIT</strong></a>
    <nav id="mainNav" class="nav" aria-label="Main navigation">
      <a class="nav-link active" href="#products" data-view="products">Products</a>
      <a class="nav-link auth-trigger" data-view="account" href="#account">Account</a>
    </nav>
    <div class="header-actions">
      <a class="button button-outline small auth-trigger" data-view="login" href="#login">Login</a>
      <a class="button small auth-trigger" data-view="register" href="#register">Register</a>
    </div>
  </header>

  <main>
    <section id="products" class="page-section products-section">
      <p id="storeStatus" class="status" role="status"></p>
      <div id="productGrid" class="product-grid" aria-live="polite"></div>
    </section>

    <section id="loginView" class="account-view page-section narrow hidden" aria-labelledby="loginTitle">
      <button class="form-close auth-trigger" data-view="products" type="button" aria-label="Close login form">Close</button>
      <h2 id="loginTitle">Log in</h2>
      <form id="loginForm" class="form-panel">
        <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button id="loginSubmit" class="button" type="submit">Log in</button>
        <p id="loginStatus" class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-copy">New here? <a class="auth-trigger" data-view="register" href="#register">Create an account</a></p>
    </section>

    <section id="registerView" class="account-view page-section narrow hidden" aria-labelledby="registerTitle">
      <button class="form-close auth-trigger" data-view="products" type="button" aria-label="Close registration form">Close</button>
      <h2 id="registerTitle">Create account</h2>
      <form id="registerForm" class="form-panel">
        <label>Email<input id="registerEmail" type="email" autocomplete="email" required></label>
        <label>Password<input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required></label>
        <button id="registerSubmit" class="button" type="submit">Create account</button>
        <p id="registerStatus" class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-copy">Already have an account? <a class="auth-trigger" data-view="login" href="#login">Log in</a></p>
    </section>

    <section id="accountView" class="account-view page-section hidden" aria-labelledby="accountTitle">
      <button class="form-close auth-trigger" data-view="products" type="button" aria-label="Close account">Close</button>
      <h2 id="accountTitle">Your account</h2>
      <p id="accountEmail" class="account-email"></p>
      <div class="section-heading"><h3>Your licenses</h3><p id="licenseStatus" class="status" role="status"></p></div>
      <div id="licenseList" class="license-list" aria-live="polite"></div>
    </section>
  </main>

  <!-- Product bottom sheet -->
  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <div id="productSheet" class="sheet" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button id="sheetClose" class="sheet-close" type="button" aria-label="Close">✕</button>
    <div id="sheetContent" class="sheet-content"></div>
  </div>

  <!-- Floating mobile bottom nav -->
  <nav class="bottom-nav glass" aria-label="Primary">
    <a class="bottom-nav-link active" href="#products" data-view="products"><span class="bn-icon">▣</span><span>Products</span></a>
    <a class="bottom-nav-link auth-trigger" href="#account" data-view="account"><span class="bn-icon">◍</span><span>Account</span></a>
    <a class="bottom-nav-link auth-trigger" href="#login" data-view="login"><span class="bn-icon">◌</span><span>Login</span></a>
  </nav>

  <footer class="site-footer">
    <div class="footer-main">
      <div class="footer-brand"><strong>ND</strong><h3>NOVEN DIGIT</h3></div>
      <div><h4>Links</h4><a href="#products">Products</a><a href="#account">Account</a></div>
      <div><h4>Contact</h4><a href="mailto:namire345729@gmail.com">Email</a><a href="https://instagram.com/novendigit" target="_blank" rel="noreferrer">Instagram</a></div>
    </div>
    <div class="footer-bottom"><span>© 2026 NovenDigit</span></div>
  </footer>

  <script src="/store/app.js" defer></script>
</body>
</html>
